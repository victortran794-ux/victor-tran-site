name: Site health check

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to check (no trailing slash)"
        required: false
        default: "https://www.victortrandesign.com"
  schedule:
    - cron: "0 12 * * 1"  # Mondays at 12:00 UTC
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Select validation scope
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.scope.outputs.all }}
      shared: ${{ steps.scope.outputs.shared }}
      home: ${{ steps.scope.outputs.home }}
      ibm: ${{ steps.scope.outputs.ibm }}
      pikapp: ${{ steps.scope.outputs.pikapp }}
      gallery: ${{ steps.scope.outputs.gallery }}
      about: ${{ steps.scope.outputs.about }}
      pci: ${{ steps.scope.outputs.pci }}
      sal: ${{ steps.scope.outputs.sal }}
      ability: ${{ steps.scope.outputs.ability }}
      wxo: ${{ steps.scope.outputs.wxo }}
      resume: ${{ steps.scope.outputs.resume }}
      images: ${{ steps.scope.outputs.images }}
      links: ${{ steps.scope.outputs.links }}
      deployable: ${{ steps.scope.outputs.deployable }}
      design: ${{ steps.scope.outputs.design }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            node scripts/classify-health-check-scope.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="$PR_BASE_SHA"
          HEAD_SHA="$PR_HEAD_SHA"

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ || -z "$HEAD_SHA" ]]; then
            node scripts/classify-health-check-scope.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | node scripts/classify-health-check-scope.mjs >> "$GITHUB_OUTPUT"

  links:
    name: Portfolio checks
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful scope selection
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Validation scope selection failed; refusing to skip Portfolio checks."
          exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.0"
      - name: Health-check scope classifier fixture
        run: node scripts/test-classify-health-check-scope.mjs
      - name: Portable PCI and Graphic contract path fixture
        run: npm run test:contract-portability
      - name: Install Design.md dependencies
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.design == 'true'
        run: npm ci --ignore-scripts
      - name: Design.md contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.design == 'true'
        run: |
          npm run test:design-md-wiring
          npm run test:design-md
          npm run check:design-md

      - name: Home/global completion contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.home == 'true'
        run: npm run check:home-global-completion
      - name: Design DNA and live-component system contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.home == 'true'
        run: npm run check:design-dna-system
      - name: Engraved Design DNA hero contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.home == 'true'
        run: |
          npm run check:engraved-dna-hero
          npm run check:ambient-field-selection
      - name: Theme continuity and global-control contracts
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.home == 'true'
        run: |
          npm run check:theme-continuity-proof
          npm run check:global-theme-control

      - name: Content export generator policy fixture
        run: npm run test:content-export-policy
      - name: Current protected content export policy
        run: npm run check:content-export-policy
      - name: Current project manifest validation
        run: node scripts/validate-project-manifest.mjs
      - name: Final site reconciliation contract
        run: npm run check:final-site-reconciliation
      - name: Public archive-route contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.gallery == 'true'
        run: npm run check:public-archive-routes
      - name: Pi Kapp page integration contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.pikapp == 'true'
        run: |
          npm run check:pikapp-static
          npm run check:pikapp-page
      - name: IBM Patterns integration contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.ibm == 'true'
        run: npm run check:ibm-patterns
      - name: Gallery motion system contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.gallery == 'true'
        run: npm run check:gallery-motion-system
      - name: IBM Cloud and IBM Patterns browser contracts
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.ibm == 'true'
        run: |
          node scripts/check-ibmcloud-hiring-cut.mjs
          python3 -m http.server 8876 --bind 127.0.0.1 >/tmp/ibm-two-page-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8876/ibmcloud.html >/dev/null && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8876/ibmcloud.html >/dev/null
          SITE_URL=http://127.0.0.1:8876 npm run check:ibmcloud-browser
          SITE_URL=http://127.0.0.1:8876 npm run check:ibm-patterns-browser
      - name: Pi Kapp page browser contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.pikapp == 'true'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pikapp-page-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/pikappapp.html >/dev/null && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8765/pikappapp.html >/dev/null
          npm run check:pikapp-page-browser
      - name: Engraved Design DNA hero browser contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.home == 'true'
        run: |
          npm run test:site-shell
          npm run check:site-shell
          python3 scripts/check-homepage-system-alignment.py
          HERO_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          python3 -m http.server "$HERO_PORT" --bind 127.0.0.1 >/tmp/engraved-dna-hero-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          HERO_SERVER_READY=0
          for attempt in {1..20}; do
            if curl --fail --silent "http://127.0.0.1:${HERO_PORT}/index.html" >/dev/null; then
              HERO_SERVER_READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$HERO_SERVER_READY" -ne 1 ]; then
            cat /tmp/engraved-dna-hero-server.log
            exit 1
          fi
          SITE_URL="http://127.0.0.1:${HERO_PORT}" npm run check:engraved-dna-hero-browser
      - name: Production host regression check
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.deployable == 'true'
        run: node scripts/check-production-host.mjs
      - name: About semantic-heading contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.about == 'true'
        run: node scripts/check-about-semantics.mjs
      - name: About voice-calibration browser contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.about == 'true'
        run: npm run check:about-browser
      - name: Production artifact containment contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.deployable == 'true'
        run: npm run check:artifact-containment
      - name: PCI claims and publication contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.pci == 'true'
        run: npm run check:pci-claims-protection
      - name: PCI responsive browser contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.pci == 'true'
        run: |
          PCI_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          PCI_URL="http://127.0.0.1:${PCI_PORT}/pci.html"
          python3 -m http.server "$PCI_PORT" --bind 127.0.0.1 >/tmp/pci-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 0.1
          PCI_SERVER_READY=0
          for attempt in {1..20}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/pci-browser-server.log
              exit 1
            fi
            if curl --fail --silent "$PCI_URL" >/dev/null; then
              PCI_SERVER_READY=1
              break
            fi
            sleep 0.25
          done
          if [ "${PCI_SERVER_READY:-0}" -ne 1 ]; then
            cat /tmp/pci-browser-server.log
            exit 1
          fi
          kill -0 "$SERVER_PID"
          curl --fail --silent "$PCI_URL" >/dev/null
          SITE_URL="http://127.0.0.1:${PCI_PORT}" npm run check:pci-browser
      - name: Star & Lamp bounded revision contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.sal == 'true'
        run: npm run check:sal-vico2
      - name: Star & Lamp responsive browser contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.sal == 'true'
        run: |
          SAL_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          SAL_URL="http://127.0.0.1:${SAL_PORT}/salmagazine.html"
          python3 -m http.server "$SAL_PORT" --bind 127.0.0.1 >/tmp/sal-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 0.1
          SAL_SERVER_READY=0
          for attempt in {1..20}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/sal-browser-server.log
              exit 1
            fi
            if curl --fail --silent "$SAL_URL" >/dev/null; then
              SAL_SERVER_READY=1
              break
            fi
            sleep 0.25
          done
          if [ "${SAL_SERVER_READY:-0}" -ne 1 ]; then
            cat /tmp/sal-browser-server.log
            exit 1
          fi
          kill -0 "$SERVER_PID"
          curl --fail --silent "$SAL_URL" >/dev/null
          SITE_URL="http://127.0.0.1:${SAL_PORT}" npm run check:sal-browser
      - name: Ability Experience bounded sequence contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.ability == 'true'
        run: npm run check:ability-vico2
      - name: Ability Experience responsive browser contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.ability == 'true'
        run: |
          ABILITY_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          ABILITY_URL="http://127.0.0.1:${ABILITY_PORT}/abilityexperience.html"
          python3 -m http.server "$ABILITY_PORT" --bind 127.0.0.1 >/tmp/ability-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 0.1
          ABILITY_SERVER_READY=0
          for attempt in {1..20}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/ability-browser-server.log
              exit 1
            fi
            if curl --fail --silent "$ABILITY_URL" >/dev/null; then
              ABILITY_SERVER_READY=1
              break
            fi
            sleep 0.25
          done
          if [ "${ABILITY_SERVER_READY:-0}" -ne 1 ]; then
            cat /tmp/ability-browser-server.log
            exit 1
          fi
          kill -0 "$SERVER_PID"
          curl --fail --silent "$ABILITY_URL" >/dev/null
          SITE_URL="http://127.0.0.1:${ABILITY_PORT}" npm run check:ability-browser
      - name: Lighthouse coverage regression check
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.pikapp == 'true'
        run: node scripts/check-lighthouse-coverage.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: >-
          needs.changes.outputs.all == 'true' ||
          needs.changes.outputs.shared == 'true' ||
          needs.changes.outputs.wxo == 'true' ||
          needs.changes.outputs.resume == 'true' ||
          needs.changes.outputs.images == 'true' ||
          needs.changes.outputs.gallery == 'true'
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: >-
          needs.changes.outputs.all == 'true' ||
          needs.changes.outputs.shared == 'true' ||
          needs.changes.outputs.resume == 'true' ||
          needs.changes.outputs.images == 'true' ||
          needs.changes.outputs.gallery == 'true'
        with:
          version: "0.11.14"
      - name: Résumé deterministic build and artifact contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.resume == 'true'
        run: npm run test:resume-build
      - name: wxO and Document Processing protected deep-link regression
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.wxo == 'true'
        run: |
          npm run check:protected-delivery
          npm run check:wxo-document-processing
          node scripts/check-wxo-public-candidate.mjs
          node scripts/check-wxo-route-split.mjs
          python3 -m http.server 8898 --bind 127.0.0.1 >/tmp/wxo-document-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8898/wxo-canvas.html >/dev/null && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8898/wxo-canvas.html >/dev/null
          SITE_URL=http://127.0.0.1:8898 npm run check:wxo-document-processing-browser
      - name: Regenerate responsive images reproducibly
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.images == 'true'
        run: |
          python -m pip install pillow==12.3.0
          python scripts/generate-responsive-images.py
          git diff --exit-code -- images/responsive
      - name: Responsive image regression check
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.images == 'true'
        run: node scripts/check-responsive-images.mjs
      - name: Graphic responsive image ownership contracts
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.gallery == 'true' || needs.changes.outputs.images == 'true'
        run: |
          npm run check:graphic-responsive-images
          npm run test:responsive-output-bounds
      - name: Gallery media regression check
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.gallery == 'true' || needs.changes.outputs.images == 'true'
        run: node scripts/check-gallery-media.mjs
      - name: UI Gallery integration contract
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.gallery == 'true'
        run: npm run check:ui-gallery
      - name: Visual archives integration and browser contracts
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.gallery == 'true'
        run: |
          node scripts/check-visual-archives-integration.mjs all
          python3 -m http.server 8896 --bind 127.0.0.1 >/tmp/visual-archives-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8896/artillustration.html >/dev/null && break
            sleep 0.25
          done
          kill -0 "$SERVER_PID"
          curl --fail --silent http://127.0.0.1:8896/artillustration.html >/dev/null
          SITE_URL=http://127.0.0.1:8896 npm run check:visual-archives-lightbox-browser
          npm run test:graphic-responsive-network
          npm run test:graphic-responsive-no-io
          npm run test:art-responsive-network
          npm run test:art-responsive-no-io
      - name: Lychee link check
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.links == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          # Protected pages, including Document Processing, stay visitor-gated, noindex,
          # and omitted from sitemap/indexing checks. Document Processing is omitted from
          # Work and homepage navigation and is reached through the protected wxO chapter.
          args: >
            --no-progress
            --max-concurrency 8
            --accept 200,206,429,999
            --root-dir ${{ github.workspace }}
            --exclude "localhost"
            --exclude "victor-tran-site-2vxf.vercel.app"
            --exclude "linkedin.com"
            --exclude "api/wxo-access"

            --exclude "${{ github.event_name == 'pull_request' && 'www.victortrandesign.com/wxo-canvas' || 'a^' }}"
            --exclude "${{ github.event_name == 'pull_request' && 'www.victortrandesign.com/uigallery' || 'a^' }}"
            "./*.html"
          fail: true

  lighthouse:
    name: Lighthouse audit · desktop
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.all == 'true' || needs.changes.outputs.deployable == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Resolve base URL
        id: url
        env:
          BASE_INPUT: ${{ github.event.inputs.url }}
        run: |
          BASE="${BASE_INPUT:-https://www.victortrandesign.com}"
          if [[ "$BASE" == *$'\n'* || "$BASE" == *$'\r'* ]]; then
            echo "::error::Base URL must not contain newlines."
            exit 1
          fi
          if [[ ! "$BASE" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::Base URL must be an http/https origin without a trailing slash."
            exit 1
          fi
          printf 'base=%s\n' "$BASE" >> "$GITHUB_OUTPUT"
      - name: Run desktop Lighthouse coverage
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.url.outputs.base }}/
            ${{ steps.url.outputs.base }}/about
            ${{ steps.url.outputs.base }}/salmagazine
            ${{ steps.url.outputs.base }}/pikappapp
            ${{ steps.url.outputs.base }}/abilityexperience
            ${{ steps.url.outputs.base }}/artillustration
            ${{ steps.url.outputs.base }}/graphicgallery
            ${{ steps.url.outputs.base }}/uigallery
            ${{ steps.url.outputs.base }}/ibmcloud
            ${{ steps.url.outputs.base }}/ibm-patterns
            ${{ steps.url.outputs.base }}/pci
          uploadArtifacts: true
          artifactName: lighthouse-results-desktop
          temporaryPublicStorage: false
          configPath: ./.github/lighthouse-budget.json

  lighthouse-mobile:
    name: Lighthouse audit · mobile
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.all == 'true' || needs.changes.outputs.deployable == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Resolve base URL
        id: url
        env:
          BASE_INPUT: ${{ github.event.inputs.url }}
        run: |
          BASE="${BASE_INPUT:-https://www.victortrandesign.com}"
          if [[ "$BASE" == *$'\n'* || "$BASE" == *$'\r'* ]]; then
            echo "::error::Base URL must not contain newlines."
            exit 1
          fi
          if [[ ! "$BASE" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::Base URL must be an http/https origin without a trailing slash."
            exit 1
          fi
          printf 'base=%s\n' "$BASE" >> "$GITHUB_OUTPUT"
      - name: Run representative mobile Lighthouse coverage
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.url.outputs.base }}/
            ${{ steps.url.outputs.base }}/about
            ${{ steps.url.outputs.base }}/artillustration
            ${{ steps.url.outputs.base }}/uigallery
            ${{ steps.url.outputs.base }}/ibmcloud
            ${{ steps.url.outputs.base }}/ibm-patterns
            ${{ steps.url.outputs.base }}/pci
          uploadArtifacts: true
          artifactName: lighthouse-results-mobile
          temporaryPublicStorage: false
          configPath: ./.github/lighthouse-mobile.json

  images:
    name: Oversized image scan
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Flag images over 1MB
        run: |
          set -e
          OVERSIZED=$(find images -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) -size +1024k 2>/dev/null || true)
          if [ -n "$OVERSIZED" ]; then
            echo "::warning::Images over 1MB detected:"
            echo "$OVERSIZED" | while read -r f; do
              SIZE=$(du -h "$f" | cut -f1)
              echo "  $f ($SIZE)"
            done
          else
            echo "All images under 1MB."
          fi
