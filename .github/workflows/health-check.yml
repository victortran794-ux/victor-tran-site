jobs:
  links:
    name: Broken link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.0"
          cache: npm
      - name: Verify reproducible Pi Kapp demo build
        run: |
          npm ci --ignore-scripts
          npm run verify:pikapp-demo
      - name: Pi Kapp page integration contract
        run: npm run check:pikapp-page
      - name: IBM Patterns integration contract
        run: npm run check:ibm-patterns
      - name: IBM Cloud and IBM Patterns browser contracts
        run: |
          node scripts/check-ibmcloud-hiring-cut.mjs
          python3 -m http.server 8876 --bind 127.0.0.1 >/tmp/ibm-two-page-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8876/ibmcloud.html >/dev/null && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8876/ibmcloud.html >/dev/null
          SITE_URL=http://127.0.0.1:8876 npm run check:ibmcloud-browser
          SITE_URL=http://127.0.0.1:8876 npm run check:ibm-patterns-browser
      - name: Pi Kapp page browser contract
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pikapp-page-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/pikappapp.html >/dev/null && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8765/pikappapp.html >/dev/null
          npm run check:pikapp-page-browser
      - name: Home lens portal contract
        run: |
          npm run test:site-shell
          npm run check:site-shell
          python3 scripts/check-homepage-system-alignment.py
          npm run check:home-lens-portal-browser
      - name: Production host regression check
        run: node scripts/check-production-host.mjs
      - name: About semantic-heading contract
        run: node scripts/check-about-semantics.mjs
      - name: About voice-calibration browser contract
        run: npm run check:about-browser
      - name: Production artifact containment contract
        run: npm run check:artifact-containment
      - name: PCI claims and protection contract
        run: npm run check:pci-claims-protection
      - name: PCI responsive browser contract
        run: |
          PCI_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          PCI_URL="http://127.0.0.1:${PCI_PORT}/pci.html"
          python3 -m http.server "$PCI_PORT" --bind 127.0.0.1 >/tmp/pci-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 0.1
          PCI_SERVER_READY=0
          for attempt in {1..20}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/pci-browser-server.log
              exit 1
            fi
            if curl --fail --silent "$PCI_URL" >/dev/null; then
              PCI_SERVER_READY=1
              break
            fi
            sleep 0.25
          done
          if [ "${PCI_SERVER_READY:-0}" -ne 1 ]; then
            cat /tmp/pci-browser-server.log
            exit 1
          fi
          kill -0 "$SERVER_PID"
          curl --fail --silent "$PCI_URL" >/dev/null
          SITE_URL="http://127.0.0.1:${PCI_PORT}" npm run check:pci-browser
      - name: Star & Lamp bounded revision contract
        run: npm run check:sal-vico2
      - name: Star & Lamp responsive browser contract
        run: |
          SAL_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          SAL_URL="http://127.0.0.1:${SAL_PORT}/salmagazine.html"
          python3 -m http.server "$SAL_PORT" --bind 127.0.0.1 >/tmp/sal-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 0.1
          SAL_SERVER_READY=0
          for attempt in {1..20}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/sal-browser-server.log
              exit 1
            fi
            if curl --fail --silent "$SAL_URL" >/dev/null; then
              SAL_SERVER_READY=1
              break
            fi
            sleep 0.25
          done
          if [ "${SAL_SERVER_READY:-0}" -ne 1 ]; then
            cat /tmp/sal-browser-server.log
            exit 1
          fi
          kill -0 "$SERVER_PID"
          curl --fail --silent "$SAL_URL" >/dev/null
          SITE_URL="http://127.0.0.1:${SAL_PORT}" npm run check:sal-browser
      - name: Ability Experience bounded sequence contract
        run: npm run check:ability-vico2
      - name: Ability Experience responsive browser contract
        run: |
          ABILITY_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          ABILITY_URL="http://127.0.0.1:${ABILITY_PORT}/abilityexperience.html"
          python3 -m http.server "$ABILITY_PORT" --bind 127.0.0.1 >/tmp/ability-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 0.1
          ABILITY_SERVER_READY=0
          for attempt in {1..20}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/ability-browser-server.log
              exit 1
            fi
            if curl --fail --silent "$ABILITY_URL" >/dev/null; then
              ABILITY_SERVER_READY=1
              break
            fi
            sleep 0.25
          done
          if [ "${ABILITY_SERVER_READY:-0}" -ne 1 ]; then
            cat /tmp/ability-browser-server.log
            exit 1
          fi
          kill -0 "$SERVER_PID"
          curl --fail --silent "$ABILITY_URL" >/dev/null
          SITE_URL="http://127.0.0.1:${ABILITY_PORT}" npm run check:ability-browser
      - name: Lighthouse coverage regression check
        run: node scripts/check-lighthouse-coverage.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: wxO and Document Processing protected deep-link regression
        run: |
          npm run check:wxo-document-processing
          python3 -m http.server 8898 --bind 127.0.0.1 >/tmp/wxo-document-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8898/wxo-canvas.html >/dev/null && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8898/wxo-canvas.html >/dev/null
          SITE_URL=http://127.0.0.1:8898 npm run check:wxo-document-processing-browser
      - name: Regenerate responsive images reproducibly
        run: |
          python -m pip install pillow==12.3.0
          python scripts/generate-responsive-images.py
          git diff --exit-code -- images/responsive
      - name: Responsive image regression check
        run: node scripts/check-responsive-images.mjs
      - name: Gallery media regression check
        run: node scripts/check-gallery-media.mjs
      - name: Lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          # Protected pages, including Document Processing, are expected to stay live,
          # visitor-gated, noindex, and omitted from sitemap/indexing checks. Document
          # Processing is currently linked from the Work dropdown; do not treat it as
          # direct-link only unless navigation links are intentionally removed.
          args: >
            --no-progress
            --max-concurrency 8
            --accept 200,206,429,999
            --root-dir ${{ github.workspace }}
            --exclude "localhost"
            --exclude "victor-tran-site-2vxf.vercel.app"
            --exclude "linkedin.com"
            --exclude "pikappapp/demo"
            --exclude "${{ github.event_name == 'pull_request' && 'www.victortrandesign.com/wxo-canvas' || 'a^' }}"
            "./*.html"
          fail: true

  lighthouse:
    name: Lighthouse audit · desktop
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Resolve base URL
        id: url
        env:
          BASE_INPUT: ${{ github.event.inputs.url }}
        run: |
          BASE="${BASE_INPUT:-https://www.victortrandesign.com}"
          if [[ "$BASE" == *$'\n'* || "$BASE" == *$'\r'* ]]; then
            echo "::error::Base URL must not contain newlines."
            exit 1
          fi
          if [[ ! "$BASE" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::Base URL must be an http/https origin without a trailing slash."
            exit 1
          fi
          printf 'base=%s\n' "$BASE" >> "$GITHUB_OUTPUT"
      - name: Run desktop Lighthouse coverage
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.url.outputs.base }}/
            ${{ steps.url.outputs.base }}/about
            ${{ steps.url.outputs.base }}/salmagazine
            ${{ steps.url.outputs.base }}/pikappapp
            ${{ steps.url.outputs.base }}/abilityexperience
            ${{ steps.url.outputs.base }}/artillustration
            ${{ steps.url.outputs.base }}/graphicgallery
            ${{ steps.url.outputs.base }}/wxo-canvas
            ${{ steps.url.outputs.base }}/document-processing
            ${{ steps.url.outputs.base }}/ibmcloud
            ${{ steps.url.outputs.base }}/ibm-patterns
            ${{ steps.url.outputs.base }}/pci
            ${{ steps.url.outputs.base }}/pikappapp/demo
          uploadArtifacts: true
          artifactName: lighthouse-results-desktop
          temporaryPublicStorage: true
          configPath: ./.github/lighthouse-budget.json

  lighthouse-mobile:
    name: Lighthouse audit · mobile
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Resolve base URL
        id: url
        env:
          BASE_INPUT: ${{ github.event.inputs.url }}
        run: |
          BASE="${BASE_INPUT:-https://www.victortrandesign.com}"
          if [[ "$BASE" == *$'\n'* || "$BASE" == *$'\r'* ]]; then
            echo "::error::Base URL must not contain newlines."
            exit 1
          fi
          if [[ ! "$BASE" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::Base URL must be an http/https origin without a trailing slash."
            exit 1
          fi
          printf 'base=%s\n' "$BASE" >> "$GITHUB_OUTPUT"
      - name: Run representative mobile Lighthouse coverage
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.url.outputs.base }}/
            ${{ steps.url.outputs.base }}/about
            ${{ steps.url.outputs.base }}/artillustration
            ${{ steps.url.outputs.base }}/wxo-canvas
            ${{ steps.url.outputs.base }}/document-processing
            ${{ steps.url.outputs.base }}/pikappapp/demo
          uploadArtifacts: true
          artifactName: lighthouse-results-mobile
          temporaryPublicStorage: true
          configPath: ./.github/lighthouse-mobile.json

  images:
    name: Oversized image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Flag images over 1MB
        run: |
          set -e
          OVERSIZED=$(find images -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) -size +1024k 2>/dev/null || true)
          if [ -n "$OVERSIZED" ]; then
            echo "::warning::Images over 1MB detected:"
            echo "$OVERSIZED" | while read -r f; do
              SIZE=$(du -h "$f" | cut -f1)
              echo "  $f ($SIZE)"
            done
          else
            echo "All images under 1MB."
          fi
