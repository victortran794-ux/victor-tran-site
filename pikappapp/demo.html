// --------------------------------------------------------------------------
// Motion helpers
// --------------------------------------------------------------------------

const SPRING = { type: "spring", stiffness: 380, damping: 32, mass: 0.7 };
const SPRING_SOFT = { type: "spring", stiffness: 220, damping: 28, mass: 0.9 };
const EASE = { duration: 0.18, ease: [0.4, 0, 0.2, 1] };

function useMotion() {
  const reduced = useReducedMotion();
  return {
    spring: reduced ? EASE : SPRING,
    softSpring: reduced ? EASE : SPRING_SOFT,
    reduced,
  };
}

// --------------------------------------------------------------------------
// Brand mark — gold star
// --------------------------------------------------------------------------

const StarSVG = ({ className = "", ...rest }) => (
  <svg viewBox="0 0 100 100" className={className} {...rest} aria-hidden>
    <path
      d="M50 4 L61.5 38.2 L97 38.2 L68.4 59.4 L79.7 93.6 L50 72.5 L20.3 93.6 L31.6 59.4 L3 38.2 L38.5 38.2 Z"
      fill="currentColor"
    />
  </svg>
);

// --------------------------------------------------------------------------
// Splash screen
// --------------------------------------------------------------------------

function Splash({ onDone }) {
  const { reduced } = useMotion();
  useEffect(() => {
    const t = setTimeout(onDone, reduced ? 200 : 1400);
    return () => clearTimeout(t);
  }, [onDone, reduced]);

  return (
    <motion.div
      key="splash"
      className="absolute inset-0 z-30 flex flex-col items-center justify-center bg-pikapp-blue text-white hex-bg"
      initial={{ opacity: 1 }}
      exit={{ opacity: 0 }}
      transition={{ duration: 0.5, ease: "easeOut" }}
    >
      <motion.div
        initial={{ scale: 0.6, opacity: 0, rotate: -30 }}
        animate={{ scale: 1, opacity: 1, rotate: 0 }}
        transition={{ ...SPRING_SOFT, delay: 0.05 }}
        className="text-pikapp-gold w-24 h-24 drop-shadow-[0_4px_24px_rgba(232,179,61,0.55)]"
      >
        <StarSVG className="w-full h-full animate-spin-slow" />
      </motion.div>
      <motion.p
        initial={{ opacity: 0, y: 8 }}
        animate={{ opacity: 1, y: 0 }}
        transition={{ delay: 0.35, duration: 0.5 }}
        className="mt-8 font-brand uppercase tracking-[0.4em] text-xs text-white/70"
      >
        Pi Kappa Phi
      </motion.p>
      <motion.p
        initial={{ opacity: 0, y: 8 }}
        animate={{ opacity: 1, y: 0 }}
        transition={{ delay: 0.5, duration: 0.5 }}
        className="font-display text-3xl mt-2"
      >
        Iota Theta
      </motion.p>
    </motion.div>
  );
}

// --------------------------------------------------------------------------

function StatusBar({ light = false }) {
  const tone = light ? "text-white" : "text-pikapp-ink";
  return (
    <div className={`relative z-20 h-11 px-7 flex items-center justify-between text-[13px] font-semibold ${tone} pointer-events-none select-none`}>
      <span>9:41</span>
      <span className="flex items-center gap-1">
        {/* signal */}
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.5"/><rect x="4.5" y="5" width="3" height="6" rx="0.5"/><rect x="9" y="2.5" width="3" height="8.5" rx="0.5"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>
        {/* wifi */}
        <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 11 L10 8.6 A2.6 2.6 0 0 0 6 8.6 Z M8 6.5 a4.5 4.5 0 0 0 -3.4 1.55 l1.4 1.55 a2.6 2.6 0 0 1 4 0 l1.4 -1.55 A4.5 4.5 0 0 0 8 6.5 Z M8 2.2 a8.5 8.5 0 0 0 -6.7 3.2 l1.4 1.55 a6.6 6.6 0 0 1 10.6 0 l1.4 -1.55 A8.5 8.5 0 0 0 8 2.2 Z"/></svg>
        {/* battery */}
        <svg width="27" height="11" viewBox="0 0 27 11" fill="none"><rect x="0.5" y="0.5" width="22" height="10" rx="2.5" stroke="currentColor" strokeOpacity="0.5"/><rect x="2" y="2" width="19" height="7" rx="1.5" fill="currentColor"/><rect x="23.5" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor" fillOpacity="0.5"/></svg>
      </span>

// --------------------------------------------------------------------------
// Avatar with progress ring
// --------------------------------------------------------------------------

function AvatarRing({ progress, size = 64, initials = "VT" }) {
  const stroke = 4;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - progress);

  return (
    <div className="relative" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="absolute inset-0 -rotate-90">
        <circle
          cx={size/2} cy={size/2} r={r}
          stroke="rgba(255,255,255,0.18)"
          strokeWidth={stroke}
          fill="none"
        />
        <motion.circle
          cx={size/2} cy={size/2} r={r}
          stroke="#E8B33D"
          strokeWidth={stroke}
          strokeLinecap="round"
          fill="none"
          strokeDasharray={c}
          initial={{ strokeDashoffset: c }}
          animate={{ strokeDashoffset: offset }}
          transition={{ ...SPRING_SOFT, delay: 0.1 }}
          style={{ filter: "drop-shadow(0 0 6px rgba(232,179,61,0.5))" }}
        />
      </svg>
      <div
        className="absolute inset-[5px] rounded-full bg-pikapp-blue-mid border border-white/20 flex items-center justify-center text-pikapp-gold-light font-display text-xl"
        aria-label={`${MEMBER.name} avatar`}
      >
        {initials}
      </div>
    </div>
  );
}

// --------------------------------------------------------------------------
// Rank chip with trend
// --------------------------------------------------------------------------

function RankChip({ rank, of, trend }) {

    <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/10 backdrop-blur border border-white/10 text-xs">
      <span className="font-medium text-white/90">Ranked #{rank} of {of}</span>
      <span className="h-3 w-px bg-white/15" />
      <span className="inline-flex items-center gap-1 text-pikapp-gold-light">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor" aria-hidden>
          <path d="M5 1 L9 6 L6.5 6 L6.5 9 L3.5 9 L3.5 6 L1 6 Z"/>
        </svg>
        {trend} this week
      </span>
    </div>
  );
}

// --------------------------------------------------------------------------
// Member dashboard
// --------------------------------------------------------------------------

function MemberTab({ milestones, onToggleTask, expandedId, setExpandedId, frozenBurst }) {
  const total = milestones.reduce((s, m) => s + m.tasks.length, 0);
  const done  = milestones.reduce((s, m) => s + m.tasks.filter(t => t.done).length, 0);
  const pct   = total ? done / total : 0;

  return (
    <div className="flex flex-col h-full overflow-hidden">
      {/* Glass header with hex tessellation */}
      <div className="relative bg-pikapp-blue text-white pb-6">
        <div className="absolute inset-0 hex-bg opacity-90 pointer-events-none" />
        <div className="absolute inset-x-0 bottom-0 h-12 bg-gradient-to-b from-transparent to-pikapp-blue/40 pointer-events-none" />
        <StatusBar light />

        <div className="relative px-5 pt-1">
          <div className="flex items-center gap-4">
            <AvatarRing progress={pct} />
            <div className="flex-1 min-w-0">
              <p className="text-[10px] uppercase tracking-[0.24em] text-pikapp-gold-light/80 font-brand truncate">
                {MEMBER.chapter} Chapter
              </p>
              <h1 className="font-display text-2xl leading-tight truncate">{MEMBER.name}</h1>
            </div>
            <button className="w-9 h-9 rounded-full bg-white/10 border border-white/10 flex items-center justify-center hover:bg-white/15 transition-colors">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden>
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
              <span className="sr-only">Notifications</span>
            </button>
          </div>

          {/* Slim baseline progress bar */}
          <div className="mt-5">
            <div className="flex items-center justify-between text-[11px] uppercase tracking-wider">
              <span className="text-white/60 font-brand">Semester progress</span>
              <span className="text-pikapp-gold font-semibold tracking-normal">{Math.round(pct * 100)}%</span>
            </div>
            <div className="mt-1.5 h-1.5 rounded-full bg-white/10 overflow-hidden">
              <motion.div
                className="h-full rounded-full bg-gradient-to-r from-pikapp-gold-deep via-pikapp-gold to-pikapp-gold-light"
                initial={{ width: 0 }}
                animate={{ width: `${pct * 100}%` }}
                transition={{ ...SPRING_SOFT, delay: 0.15 }}
                style={{ boxShadow: "0 0 12px rgba(232,179,61,0.6)" }}
              />
            </div>
            <div className="mt-3">
              <RankChip rank={MEMBER.rank} of={MEMBER.rankOf} trend={MEMBER.rankTrend} />
            </div>
          </div>
        </div>
      </div>

      {/* Scrollable content */}
      <div className="flex-1 overflow-y-auto no-scrollbar pb-32 bg-pikapp-cream">
        <SectionHeader>Chapter Bulletin</SectionHeader>
        <div className="px-5 space-y-3">
          {BULLETIN.map((b, i) => (
            <BulletinCard key={b.id} item={b} delay={i * 0.04} />
          ))}
        </div>

        <SectionHeader right={<span className="text-[11px] text-pikapp-ink/50 font-medium normal-case tracking-normal">{done}/{total} complete</span>}>

        <LayoutGroup>
          <div className="px-5 space-y-2">

              <MilestoneCard
                key={m.id}
                milestone={m}
                expanded={expandedId === m.id}
                onToggle={() => setExpandedId(expandedId === m.id ? null : m.id)}

                frozenBurst={frozenBurst}

        </LayoutGroup>
      </div>
    </div>
  );
}

function SectionHeader({ children, right }) {
  return (
    <div className="px-5 pt-7 pb-3 flex items-end justify-between">
      <h2 className="text-[11px] font-brand uppercase tracking-[0.24em] text-pikapp-ink/60">{children}</h2>
      {right}

// --------------------------------------------------------------------------
// Bulletin card
// --------------------------------------------------------------------------

function BulletinCard({ item, delay = 0 }) {
  return (
    <motion.article
      initial={{ opacity: 0, y: 8 }}
      animate={{ opacity: 1, y: 0 }}
      transition={{ delay, duration: 0.35, ease: "easeOut" }}
      className="bg-white rounded-2xl p-4 shadow-card border border-pikapp-ink/5"
    >
      <div className="flex items-center justify-between mb-1.5">
        <span className="inline-flex items-center gap-1.5 text-[10px] font-semibold uppercase tracking-wider text-pikapp-blue-mid">
          <span className="w-1.5 h-1.5 rounded-full bg-pikapp-gold" />
          {item.tag}
        </span>
        <span className="text-[11px] text-pikapp-ink/40">{item.when}</span>
      </div>
      <h3 className="font-display text-[17px] leading-snug text-pikapp-ink">{item.title}</h3>
      <p className="mt-1 text-[13px] leading-relaxed text-pikapp-ink/65">{item.body}</p>
    </motion.article>
  );
}

// --------------------------------------------------------------------------
// Milestone card with expandable task list
// --------------------------------------------------------------------------

function MilestoneCard({ milestone, expanded, onToggle, onToggleTask, frozenBurst }) {
  const total = milestone.tasks.length;
  const done = milestone.tasks.filter(t => t.done).length;
  const pct = done / total;
  const isComplete = done === total;

  return (
    <motion.div
      layout
      transition={SPRING_SOFT}
      className={`bg-white rounded-2xl shadow-card border overflow-hidden ${expanded ? "border-pikapp-gold/40" : "border-pikapp-ink/5"}`}
    >
      <motion.button
        layout="position"
        onClick={onToggle}
        className="w-full text-left px-4 py-3.5 flex items-center gap-3 active:bg-pikapp-cream/60 transition-colors"
      >
        <div className="relative w-10 h-10 flex-shrink-0">
          <svg viewBox="0 0 36 36" className="w-full h-full -rotate-90">
            <circle cx="18" cy="18" r="15" stroke="rgba(14,26,62,0.08)" strokeWidth="3" fill="none" />
            <motion.circle
              cx="18" cy="18" r="15"
              stroke={isComplete ? "#E8B33D" : "#15295C"}
              strokeWidth="3"
              strokeLinecap="round"
              fill="none"
              strokeDasharray={2 * Math.PI * 15}
              initial={false}
              animate={{ strokeDashoffset: 2 * Math.PI * 15 * (1 - pct) }}
              transition={SPRING_SOFT}
            />
          </svg>
          {isComplete ? (
            <div className="absolute inset-0 flex items-center justify-center text-pikapp-gold">
              <StarSVG className="w-4 h-4" />
            </div>
          ) : (
            <div className="absolute inset-0 flex items-center justify-center text-[10px] font-semibold text-pikapp-ink/70 tabular-nums">
              {done}/{total}
            </div>
          )}
        </div>
        <div className="flex-1 min-w-0">
          <h3 className="font-display text-[18px] leading-tight text-pikapp-ink">{milestone.title}</h3>
          <p className="text-[12px] text-pikapp-ink/50 truncate">{milestone.blurb}</p>
        </div>
        <motion.svg
          animate={{ rotate: expanded ? 180 : 0 }}
          transition={SPRING_SOFT}
          width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
          className="text-pikapp-ink/40"
          aria-hidden
        >
          <polyline points="6 9 12 15 18 9" />
        </motion.svg>
      </motion.button>

      <AnimatePresence initial={false}>
        {expanded && (
          <motion.div
            key="content"
            initial={{ height: 0, opacity: 0 }}
            animate={{ height: "auto", opacity: 1 }}
            exit={{ height: 0, opacity: 0 }}
            transition={{ ...SPRING_SOFT, opacity: { duration: 0.18 } }}
            className="overflow-hidden"
          >
            <div className="px-4 pb-3 pt-0">
              <div className="border-t border-pikapp-ink/8 pt-3 space-y-1.5">
                {milestone.tasks.map((task) => (
                  <TaskRow
                    key={task.id}
                    task={task}
                    onToggle={() => onToggleTask(milestone.id, task.id)}
                    frozenBurst={frozenBurst === task.id}
                  />
                ))}
              </div>
            </div>
          </motion.div>
        )}
      </AnimatePresence>
    </motion.div>
  );
}

// --------------------------------------------------------------------------
// Task row with star particle on completion
// --------------------------------------------------------------------------

function TaskRow({ task, onToggle, frozenBurst }) {
  // each completion bumps `burst` to remount the particle
  const [burst, setBurst] = useState(0);

  const handleClick = () => {
    if (!task.done) setBurst((b) => b + 1);
    onToggle();
  };

  return (
    <button
      onClick={handleClick}
      className="w-full flex items-center gap-3 py-2 px-1 rounded-lg hover:bg-pikapp-cream/70 active:bg-pikapp-cream transition-colors group"
    >
      <div className="relative flex-shrink-0">
        <Checkbox checked={task.done} />
        {/* Demo capture: static star, peak-of-animation pose, scaled up for screenshot legibility */}
        {frozenBurst && (
          <div
            className="absolute inset-0 flex items-center justify-center pointer-events-none text-pikapp-gold"
            style={{ transform: "translate(0px, -4px) scale(2.4) rotate(10deg)", opacity: 1 }}
          >
            <StarSVG className="w-7 h-7 drop-shadow-[0_0_14px_rgba(232,179,61,1)]" />
          </div>
        )}
        <AnimatePresence>
          {!frozenBurst && burst > 0 && task.done && (
            <motion.div
              key={burst}
              className="absolute inset-0 flex items-center justify-center pointer-events-none text-pikapp-gold"
              initial={{ scale: 0.4, opacity: 0, y: 0 }}
              animate={{ scale: [0.4, 1.6, 1.2], opacity: [0, 1, 0], y: -22, rotate: 18 }}
              exit={{ opacity: 0 }}
              transition={{ duration: 0.7, ease: "easeOut" }}
            >
              <StarSVG className="w-5 h-5 drop-shadow-[0_0_6px_rgba(232,179,61,0.8)]" />
            </motion.div>
          )}
        </AnimatePresence>
      </div>
      <span className={`flex-1 text-left text-[14px] ${task.done ? "text-pikapp-ink/45 line-through decoration-pikapp-ink/20" : "text-pikapp-ink/85"}`}>
        {task.title}
      </span>
      <span className={`text-[11px] tabular-nums ${task.done ? "text-pikapp-gold-deep" : "text-pikapp-ink/30"}`}>
        {task.done ? `Completed ${task.date ?? ""}` : "Pending"}
      </span>
    </button>
  );
}

function Checkbox({ checked }) {
  return (
    <div
      className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors
        ${checked ? "bg-pikapp-gold border-pikapp-gold" : "border-pikapp-ink/25 bg-white group-hover:border-pikapp-blue-mid"}`}
    >
      <AnimatePresence>
        {checked && (
          <motion.svg
            key="check"
            initial={{ scale: 0, rotate: -20 }}
            animate={{ scale: 1, rotate: 0 }}
            exit={{ scale: 0 }}
            transition={SPRING}
            width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"
          >
            <polyline points="20 6 9 17 4 12" />
          </motion.svg>
        )}
      </AnimatePresence>
    </div>
  );
}

// --------------------------------------------------------------------------
// Empty-state placeholder for other tabs
// --------------------------------------------------------------------------

function EmptyTab({ title, message }) {
  return (
    <div className="flex flex-col h-full bg-pikapp-blue text-white relative hex-bg-faint overflow-hidden">
      <StatusBar light />
      <div className="flex-1 flex flex-col items-center justify-center px-8 text-center pb-32">
        <motion.div
          initial={{ scale: 0.8, opacity: 0, rotate: -20 }}
          animate={{ scale: 1, opacity: 1, rotate: 0 }}
          transition={SPRING_SOFT}
          className="text-pikapp-gold w-20 h-20 mb-6 drop-shadow-[0_0_24px_rgba(232,179,61,0.4)]"
        >
          <StarSVG className="w-full h-full animate-spin-slow" />
        </motion.div>
        <h2 className="font-display text-3xl mb-2">{title}</h2>
        <p className="text-white/60 text-sm leading-relaxed max-w-[260px]">{message}</p>
      </div>
    </div>
  );
}

// --------------------------------------------------------------------------
// Bottom tab bar — floating pill
// --------------------------------------------------------------------------

const TABS = [
  { id: "member",   label: "Member",   icon: IconUser },
  { id: "chapter",  label: "Chapter",  icon: IconUsers },
  { id: "national", label: "National", icon: IconFlag },
  { id: "settings", label: "Settings", icon: IconGear },
];

function TabBar({ active, onChange }) {
  return (
    <div className="absolute left-0 right-0 bottom-0 z-20 px-4 pb-5 pt-2 pointer-events-none">
      <LayoutGroup id="tabs">
        <nav
          role="tablist"
          aria-label="Primary"
          className="pointer-events-auto mx-auto flex items-center justify-between gap-1 px-2 py-2 rounded-full bg-pikapp-blue-deep/95 backdrop-blur-md shadow-pill border border-white/10"
          style={{ paddingBottom: "max(0.5rem, env(safe-area-inset-bottom))" }}
        >
          {TABS.map((t) => {
            const Icon = t.icon;
            const isActive = active === t.id;
            return (
              <button
                key={t.id}
                role="tab"
                aria-selected={isActive}
                onClick={() => onChange(t.id)}
                className={`relative flex-1 flex flex-col items-center gap-0.5 py-2 px-2 rounded-full transition-colors ${isActive ? "text-pikapp-blue-deep" : "text-white/70 hover:text-white"}`}
              >
                {isActive && (
                  <motion.span
                    layoutId="tab-pill"
                    className="absolute inset-0 rounded-full bg-pikapp-gold"
                    transition={SPRING}
                  />
                )}
                <Icon className="relative w-5 h-5" />
                <span className="relative text-[10px] font-semibold tracking-wide">{t.label}</span>
              </button>
            );
          })}
        </nav>
      </LayoutGroup>
    </div>
  );
}

// --------------------------------------------------------------------------
// App root
// --------------------------------------------------------------------------

function App() {
  const params = useMemo(
    () => (typeof window !== "undefined" ? new URLSearchParams(window.location.search) : new URLSearchParams()),
    []
  );
  const skipSplash = params.has("skip");
  const frozenBurst = params.get("burst");
  const initialTab = params.get("tab") || "member";
  const initialExpanded = params.get("expand") || "m1";
  const initialScroll = parseInt(params.get("scroll") || "0", 10);

  // If a burst is frozen for capture, force that task to be done
  const baseMilestones = useMemo(() => {
    if (!frozenBurst) return INITIAL_MILESTONES;
    return INITIAL_MILESTONES.map((m) => ({
      ...m,
      tasks: m.tasks.map((t) =>
        t.id === frozenBurst ? { ...t, done: true, date: formatToday() } : t
      ),
    }));
  }, [frozenBurst]);

  const [showSplash, setShowSplash] = useState(!skipSplash);
  const [activeTab, setActiveTab] = useState(initialTab);
  const [milestones, setMilestones] = useState(baseMilestones);
  const [expandedId, setExpandedId] = useState(initialExpanded);

  // Demo capture: scroll the inner content area after mount
  React.useEffect(() => {
    if (!initialScroll) return;
    const t = setTimeout(() => {
      const sc = document.querySelector(".no-scrollbar");
      if (sc) sc.scrollTop = initialScroll;
    }, 250);
    return () => clearTimeout(t);
  }, [initialScroll, activeTab]);

  const toggleTask = (milestoneId, taskId) => {
    setMilestones((prev) =>
      prev.map((m) => {
        if (m.id !== milestoneId) return m;
        return {
          ...m,
          tasks: m.tasks.map((t) =>
            t.id === taskId
              ? { ...t, done: !t.done, date: !t.done ? formatToday() : t.date }
              : t
          ),
        };
      })
    );
  };

  return (
    <DeviceShell>
      <AnimatePresence>
        {showSplash && <Splash onDone={() => setShowSplash(false)} />}
      </AnimatePresence>

      <AnimatePresence>
        <motion.div
          key={activeTab}
          initial={{ opacity: 0, y: 8 }}
          animate={{ opacity: 1, y: 0 }}
          exit={{ opacity: 0 }}
          transition={{ duration: 0.22, ease: [0.4, 0, 0.2, 1] }}
          className="absolute inset-0"
        >
          {activeTab === "member" && (
            <MemberTab
              milestones={milestones}
              onToggleTask={toggleTask}
              expandedId={expandedId}
              setExpandedId={setExpandedId}
              frozenBurst={frozenBurst}
            />
          )}
          {activeTab === "chapter" && (
            <EmptyTab
              title="Chapter"
              message="Brother roster, chapter-wide milestones, and weekly standings live here. Coming next."
            />
          )}
          {activeTab === "national" && (
            <EmptyTab
              title="National HQ"
              message="National announcements, Push America campaigns, and inter-chapter rankings will land in this view."
            />
          )}
          {activeTab === "settings" && (
            <EmptyTab
              title="Settings"
              message="Profile, notifications, theme, and privacy. Reserved for v2 of the prototype."
            />
          )}
        </motion.div>
      </AnimatePresence>

      <TabBar active={activeTab} onChange={setActiveTab} />
    </DeviceShell>
  );
}

function formatToday() {
  const d = new Date();
  return `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
}

createRoot(document.getElementById("root")).render(<App />);
