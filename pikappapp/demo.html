<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: Inter, system-ui, sans-serif;
    background: radial-gradient(120% 80% at 50% 0%, #1B2D5E 0%, #0E1A3E 60%, #07112B 100%);
    color: #FAF7EE;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  /* Hide scrollbars in the prototype scroll area */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Disable default outline; framer-motion + tap targets get their own focus rings */
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid #F5D97A;
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* Hex tessellation — Hero Patterns "Hexagons", currentColor-driven */
  .hex-bg {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='49' viewBox='0 0 28 49'><path d='M13.99 9.25l13 7.5v15l-13 7.5L1 31.75v-15l12.99-7.5zM3 17.9v12.7l10.99 6.34 11-6.35V17.9l-11-6.34L3 17.9z' fill='%23F5D97A' fill-opacity='0.10'/></svg>");
    background-repeat: repeat;
  }
  .hex-bg-faint {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='49' viewBox='0 0 28 49'><path d='M13.99 9.25l13 7.5v15l-13 7.5L1 31.75v-15l12.99-7.5zM3 17.9v12.7l10.99 6.34 11-6.35V17.9l-11-6.34L3 17.9z' fill='%23F5D97A' fill-opacity='0.06'/></svg>");
    background-repeat: repeat;
  }

  /* Subtle device shadow off-canvas */
  .device-frame {
    box-shadow:
      0 60px 120px -30px rgba(0,0,0,0.55),
      0 30px 60px -20px rgba(0,0,0,0.35),
      inset 0 0 0 1px rgba(255,255,255,0.08);
  }

  /* Rendered before the compiled local application finishes loading. */
  .prototype-boot {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .prototype-boot-card {
    width: min(100%, 390px);
    min-height: min(780px, calc(100vh - 48px));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 48px;
    background: #15295C;
    box-shadow: 0 60px 120px -30px rgba(0,0,0,0.55), 0 30px 60px -20px rgba(0,0,0,0.35);
    color: #fff;
  }
  .prototype-boot-mark {
    width: 88px;
    height: 88px;
    color: #E8B33D;
    filter: drop-shadow(0 4px 24px rgba(232,179,61,0.45));
    animation: boot-pulse 1.4s ease-in-out infinite alternate;
  }
  .prototype-boot-brand {
    margin: 28px 0 0;
    font-family: Barlow, system-ui, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.72);
  }
  .prototype-boot-status {
    margin: 10px 0 0;
    font-size: 14px;
    color: rgba(255,255,255,0.58);
  }
  .prototype-back-link {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 50;
    color: rgba(255,255,255,0.62);
    font-size: 14px;
    letter-spacing: 0.02em;
    text-decoration: none;
  }
  .prototype-back-link:hover { color: #F5D97A; }
  @media (max-width: 767px) { .prototype-back-link { display: none; } }
  @keyframes boot-pulse {
    from { opacity: 0.62; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>

</head>
<body>

<div id="root">
  <div class="prototype-boot" role="status" aria-live="polite">
    <div class="prototype-boot-card">
      <svg class="prototype-boot-mark" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 4 L61.5 38.2 L97 38.2 L68.4 59.4 L79.7 93.6 L50 72.5 L20.3 93.6 L31.6 59.4 L3 38.2 L38.5 38.2 Z" fill="currentColor" />
      </svg>
      <p class="prototype-boot-brand">Pi Kappa Phi</p>
      <p class="prototype-boot-status">Loading prototype…</p>
    </div>
  </div>
</div>
